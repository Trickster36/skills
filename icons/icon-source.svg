<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#0b0b0b"/>

  <!-- connecting lines: root -> two branches -> their children -->
  <g stroke="#7C5CFC" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="140" x2="256" y2="210"/>
    <line x1="256" y1="210" x2="170" y2="290"/>
    <line x1="256" y1="210" x2="342" y2="290"/>
    <line x1="170" y1="290" x2="170" y2="370"/>
    <line x1="342" y1="290" x2="342" y2="370"/>
  </g>

  <!-- root node (mastered - filled green) -->
  <circle cx="256" cy="120" r="34" fill="#639922"/>

  <!-- second row: left mastered, right in progress -->
  <circle cx="170" cy="290" r="30" fill="#639922"/>
  <circle cx="342" cy="290" r="30" fill="#993C1D"/>

  <!-- third row: left child unlocked/active, right child locked -->
  <circle cx="170" cy="370" r="26" fill="#7C5CFC"/>
  <circle cx="342" cy="370" r="26" fill="#3a3a3a"/>

  <!-- lock glyph on the locked node -->
  <g transform="translate(342,370)">
    <rect x="-9" y="-3" width="18" height="14" rx="3" fill="#0b0b0b"/>
    <path d="M -6 -3 L -6 -9 A 6 6 0 0 1 6 -9 L 6 -3" fill="none" stroke="#0b0b0b" stroke-width="4"/>
  </g>
</svg>
